<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dceeff" />
    <meta name="description" content="Timeline is a soft, installable lifespan visualizer for iPhone." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Timeline" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icons/icon.svg" />
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles/app.css" />
    <title>Timeline</title>
  </head>
  <body class="theme-liquid-glass" data-motion="full">
    <canvas id="fx-canvas" aria-hidden="true"></canvas>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="ambient ambient-three" aria-hidden="true"></div>

    <div id="app-shell" class="app-shell">
      <header class="app-header" aria-label="Timeline header">
        <div>
          <p class="eyebrow" id="header-kicker">Timeline</p>
          <h1 id="header-title">Loading…</h1>
        </div>
        <button id="install-button" class="icon-button hidden" type="button" aria-label="Install Timeline">
          <span aria-hidden="true">＋</span>
        </button>
      </header>

      <main id="app" class="app-content" tabindex="-1" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <button class="nav-item active" type="button" data-tab="now" aria-label="Now">
          <span class="nav-icon">◌</span>
          <span>Now</span>
        </button>
        <button class="nav-item" type="button" data-tab="timeline" aria-label="Timeline">
          <span class="nav-icon">◎</span>
          <span>Timeline</span>
        </button>
        <button class="nav-item" type="button" data-tab="distance" aria-label="Distance">
          <span class="nav-icon">↔</span>
          <span>Distance</span>
        </button>
        <button class="nav-item" type="button" data-tab="vault" aria-label="Vault">
          <span class="nav-icon">◇</span>
          <span>Vault</span>
        </button>
      </nav>
    </div>

    <section id="wizard" class="wizard hidden" aria-label="First time setup" aria-modal="true" role="dialog"></section>
    <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
